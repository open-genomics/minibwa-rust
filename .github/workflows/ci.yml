name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  MINIBWA_REQUIRE_PARITY: "1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, clippy, tests + C parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev gcc make

      - name: Build C minibwa reference
        run: |
          COMMIT=$(grep -v '^#' C_MINIBWA_COMMIT | tr -d '[:space:]')
          git clone https://github.com/lh3/minibwa.git "${GITHUB_WORKSPACE}/../minibwa"
          git -C "${GITHUB_WORKSPACE}/../minibwa" checkout "$COMMIT"
          make -C "${GITHUB_WORKSPACE}/../minibwa" -j"$(nproc)"
          test -x "${GITHUB_WORKSPACE}/../minibwa/minibwa"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (including C parity)
        run: cargo test --all-targets --all-features
