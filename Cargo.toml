[package]
name = "minibwa-rust"
version = "0.1.0"
edition = "2021"
authors = ["open-genomics"]
description = "Rust 重写的 minibwa：BWT 索引 + 变长种子 + minimap2 风格链化与比对的短读比对器"
license = "MIT"
repository = "https://github.com/open-genomics/bwa-rust"
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.6.1", features = ["derive"] }
rayon = "1.12.0"
# 后缀数组构建：libsais 2.10.4 的纯 Rust 移植（与 C 版 minibwa 使用的 libsais 同源）
libsais-rs = "0.2.2"
# .fa.gz 透明读取（对应 C 版 minibwa 的 zlib 依赖）
flate2 = "1"
# erfc（配对端 rescue 的 insert size 高斯惩罚打分）
libm = "0.2"

# jemalloc：替换默认 allocator，多线程场景显著提升
# 仅在非 Windows 平台启用（Linux glibc/musl + macOS）
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.0"

# ── Lint 配置 ─────────────────────────────────────────

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
needless_collect = "warn"
manual_memcpy = "warn"
large_enum_variant = "warn"
clone_on_ref_ptr = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
too_many_arguments = "allow"

# ── Profile 优化 ──────────────────────────────────────

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

[profile.test]
opt-level = 1
debug = true
